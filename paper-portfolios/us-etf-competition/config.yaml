schema_version: 1
competition_id: us-etf-competition-2026
name: US ETF Paper Portfolio (Open-Ended)
timezone: America/New_York
lifecycle:
  mode: open-ended
  termination: explicit-user-action-only
  final_reconciliation: explicit-close-only
  performance_horizon: all-available-history
starting_cash_usd: 100000.00
currency: USD
instrument_type: ETF

universe:
  listing: US-listed
  eligible: unleveraged long-only equity ETFs
  research_root: wiki/analysis/performance
  new_research_budget_per_rebalance: 3
  same_run_new_candidate_buy: true

schedule:
  review_days: [MO, TU, WE, TH, FR]
  review_time: "15:00" # default for the scheduled automation; manual runs override this
  manual_run_policy: evaluate-at-invocation-time
  normal_rebalance_every_trading_sessions: 1
  holiday_action: REVIEW_ONLY_FILLS_WAIT
  early_close_action: evaluate-at-invocation-time
  execution_profile: scheduled-inline

market_data:
  provider: etf-com-api-with-web-fallback
  quote_source_priority: [etf-com-delayedquotes-api, etf-com-product-page, legacy-direct-web]
  api_script: scripts/fetch_etf_quotes.py
  api_minimum_request_interval_seconds: 10
  api_cache_ttl_seconds: 900
  api_failure_policy: no-immediate-retry-fallback-on-403-or-429
  discovery: api-then-direct-page-then-browser-search
  search_snippets_as_evidence: false
  quote_source: captured-api-response-or-direct-page-with-source-as-of
  calendar_source: official-exchange-or-regulator-page
  evidence_root: evidence/market-data
  batch_root: evidence/market-data/batches
  legacy_evidence_root: evidence/market-data/YYYY-MM-DD
  screen_cache_path: evidence/market-data/latest-prices.md
  append_only_log_path: evidence/market-data/price-log.md
  normal_read_policy: screen-cache-plus-price-log-tail
  full_log_read_policy: bootstrap-or-recovery-only
  one_batch_per_run: true

price_cache:
  latest_path: evidence/market-data/latest-prices.md
  append_only_log_path: evidence/market-data/price-log.md
  canonical_history: append_only_log_path
  read_before_refresh: true
  use_for_initial_screen_only: true
  refresh_scope: holdings-benchmark-and-decision-relevant-candidates
  every_verified_price_must_be_logged: true

execution:
  phase: simulation
  authorization: explicit-user-request-2026-09-05
  broker_role: none
  system_of_record: ledger/events.jsonl
  execution_model: next-session-open
  simulated_slippage_bps_per_side: 5
  fractional_shares: true
  pending_order_policy: fixed-quantity-and-notional-cap
  broker_orders_allowed: false

costs:
  commission_usd: 0.00
  taxes: ignored-pre-tax
  cash_yield_pct: 0.00
  distributions: credit-cash-on-pay-date
  automatic_reinvestment: false

portfolio_limits:
  minimum_cash_weight_pct: 3.00
  minimum_position_weight_pct: 5.00
  maximum_position_weight_pct: 20.00
  target_position_count_min: 6 # long-term goal, never an entry prerequisite
  progressive_entry: true
  warning_maximum_position_weight_pct: 5.00
  target_position_count_max: 10
  maximum_sector_theme_weight_pct: 35.00
  maximum_high_overlap_group_weight_pct: 25.00
  high_overlap_threshold_pct: 50.00
  no_trade_band_percentage_points: 2.00
  maximum_normal_turnover_pct: 25.00

candidate_score:
  market_regime_fit: 15
  underlying_earnings_trend: 15
  valuation: 20
  strategy_quality: 15
  momentum: 20
  risk_liquidity_cost: 15
  sell_below: 45
  reduce_on_score_drop: 15

liquidity_gate:
  minimum_aum_usd: 100000000
  minimum_median_daily_dollar_volume_usd: 5000000
  maximum_bid_ask_spread_pct: 0.20
  maximum_expense_ratio_pct: 1.00
  minimum_history_years: 1.00
  seasoned_history_years: 3.00
  unseasoned_maximum_position_weight_pct: 5.00
  unseasoned_combined_weight_pct: 10.00

freshness_gate:
  decision_quote_trading_sessions: 1
  decision_quote_basis: latest-verified-quote-within-one-us-trading-day
  completed_daily_price_trading_sessions: 1
  aum_spread_liquidity_trading_sessions: 5
  holdings_valuation_days: 45
  performance_fund_facts_days: 90 # 3 calendar months; operational day-based equivalent
  methodology: latest-verified-version

benchmarks:
  operational: SPY adjusted total-return proxy
  reference: S&P 500 Total Return Index
  operational_symbol: SPY

risk:
  soft_portfolio_drawdown_pct: -10.00
  soft_minimum_cash_weight_pct: 20.00
  hard_portfolio_drawdown_pct: -15.00
  hard_minimum_cash_weight_pct: 50.00
  resume_buy_above_drawdown_pct: -10.00
  position_reunderwrite_loss_pct: -10.00
  position_reduce_loss_pct: -15.00
  reduced_position_maximum_weight_pct: 5.00

data_failure:
  scope: affected-candidate
  portfolio_blockers: [invalid-ledger, unverifiable-portfolio-risk]
  action: SKIP_CANDIDATE
  run_status: COMPLETED_WITH_GAPS
  allow_risk_reduce_or_sell_with_stale_research: true
  allow_buy_with_stale_critical_data: false

admission:
  local_review_allowed: true
  research_pass_required: false
  noncritical_research_gaps: warning-with-reduced-size
  holdings_refresh_policy: material-change-or-expired-risk-evidence
  valuation_freshness_policy: warning-unless-decision-critical
  incomplete_overlap_policy: assume-full-overlap-with-plausible-group
analysis_order:
  - reconcile-holdings-risk-and-pending-decisions
  - read-vault-performance-thesis-and-prior-blockers
  - shortlist-by-role-and-evidence
  - resolve-decision-critical-gaps
  - refresh-decision-quotes
  - score-and-size
  - record-batch-and-settle-prior-decisions
  - recheck-state-and-record-new-decisions
sentiment:
  required: false
  role: hypothesis-discovery-only
